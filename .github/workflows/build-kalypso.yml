name: Build and push Kalypso image

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile.kalypso"
      - "docker/kalypso/**"
      - "docker/kalypso.def"
      - "vllm/kalypso/**"
      - "vllm/entrypoints/openai/api_server.py"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kalypso

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.kalypso
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:vllm-0.29.0
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
